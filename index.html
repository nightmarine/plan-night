<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--dot:#eeeeee;--sf:#fff;--ink:#111111;--mt:#767676;--ln:#e4e4e4;--ac:#111111;--acs:#f1f1f1;--t-study:#111111;--t-exam:#111111;--t-life:#111111;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;display:flex;background:#fff;color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{width:176px;flex:none;padding:22px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sf);border-right:1px solid var(--ln)}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--mt);text-align:left}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
nav .sp{flex:1}
main{flex:1;min-width:0;overflow:auto;padding:28px 32px 40px}
h1{font-size:24px;font-weight:600;margin:0 0 18px}
h2{font-size:16px;font-weight:600;margin:0 0 8px}
.mt{color:var(--mt);font-size:13px}
.ib{border:0;background:none;color:var(--mt);padding:2px 7px;border-radius:6px;font-size:18px;line-height:1}
.ib:hover{background:var(--acs);color:var(--ac)}
.btn{border:1px solid var(--ln);background:var(--sf);padding:7px 16px;border-radius:9px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.danger{color:var(--t-exam)}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:8px 11px;width:100%}
.chip{display:inline-block;font-size:12px;padding:0 8px;border-radius:99px;color:#fff;line-height:20px}
.chip.study{background:var(--t-study)}.chip.exam{background:var(--t-exam)}.chip.life{background:var(--t-life)}
/* board */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{flex:none;width:272px;background:color-mix(in srgb,var(--sf) 70%,transparent);border:1px solid var(--ln);border-radius:14px;padding:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ch b{flex:1}
.cards{min-height:20px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;cursor:grab}
.card:hover{border-color:var(--ac)}
.card.done>div:first-child{text-decoration:line-through;color:var(--mt)}
.card.drag{opacity:.4}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mt)}
.due.late{color:var(--t-exam);font-weight:600}
.add,.addcol{background:transparent;border-style:dashed}
.col.ghost{background:none;border-style:dashed}
/* calendar */
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px;align-items:start}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:10px}.calh b{flex:1;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mt)}
.day{aspect-ratio:1/1.05;border:1px solid transparent;border-radius:10px;background:none;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
.day:hover{background:var(--acs)}
.day.today{border-color:var(--ac)}
.day.sel{background:var(--ac);color:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mt)}
.dots i.study{background:var(--t-study)}.dots i.exam{background:var(--t-exam)}.dots i.life{background:var(--t-life)}
.day.sel .dots i{background:#fff}
.li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln)}.li span{flex:1}
.row{display:flex;gap:8px;align-items:center}.row>.sp{flex:1}
/* pomodoro */
.pomo{max-width:380px;margin:0 auto;text-align:center}
.seg{display:inline-flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:none;padding:5px 16px;border-radius:99px;color:var(--mt)}
.seg button.on{background:var(--ac);color:#fff}
.ringw{position:relative;width:260px;height:260px;margin:0 auto 20px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:9}
#ring{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:565.5;transition:stroke-dashoffset .4s linear}
.ringw .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;font-weight:500;font-variant-numeric:tabular-nums}
/* diary & notes */
.two{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
.it{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;display:flex;flex-direction:column}
.it:hover{background:var(--acs)}.it.on{background:var(--sf);box-shadow:0 0 0 1px var(--ac) inset}
.it span:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moods{display:flex;gap:6px;margin:10px 0}
.moods button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;font-size:22px;padding:2px 9px;opacity:.5}
.moods button.on{opacity:1;border-color:var(--ac);background:var(--acs)}
.diaryta{min-height:46vh;resize:vertical;line-height:1.9}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--mt)}
.filters button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ntitle{border:0;background:none;font-size:28px;font-weight:600;padding:4px 0}
.blk{display:flex;align-items:flex-start;gap:4px}
.blk textarea{border:0;background:none;resize:none;overflow:hidden;padding:4px 6px;flex:1;line-height:1.7}
.bh{border:0;background:none;color:var(--mt);width:26px;height:30px;border-radius:6px;opacity:.35;font-size:13px}
.blk:hover .bh,.bh:focus-visible{opacity:1}.bh:hover{background:var(--acs)}
.blk.h textarea{font-size:21px;font-weight:600}
.blk input[type=checkbox]{width:18px;height:18px;margin:8px 0 0;padding:0;accent-color:var(--ac)}
.blk.todo.ck textarea{text-decoration:line-through;color:var(--mt)}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--sf);color:var(--ink);width:min(380px,92vw);padding:20px}
dialog::backdrop{background:rgba(10,14,25,.45)}
dialog label{display:block;margin-top:12px;font-size:13px;color:var(--mt)}
dialog .row{margin-top:18px}
@media (max-width:760px){
body{display:block}

nav button{flex-direction:column;gap:0;font-size:11px;padding:6px 8px;flex:1 0 auto;min-width:56px;align-items:center}
nav .sp{display:none}
main{height:100%;padding:68px 16px 28px}
.split,.two{grid-template-columns:1fr}
.col{width:82vw}
.ringw{width:230px;height:230px}
}

 ecol:e=>{pcol=e.dataset.id;dlg.querySelectorAll('.pal .sw').forEach(s=>s.classList.toggle('on',s===e))},
 ekind:e=>{ekind=e.dataset.id;e.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e));$('#etr').hidden=$('#rpr').hidden=ekind==='task';$('#ttr').hidden=ekind!=='task'},
 evsave:e=>{const t=$('#et').value.trim();if(!t)return $('#et').focus();const d=$('#ed').value||TODAY(),id=e.dataset.id;
  if(!id&&ekind==='task')S.cards.push({id:uid(),col:$('#ecl').value,t,d,c:pcol,done:0});
  else{const o={t,d,s:$('#es').value,e:$('#ee').value,c:pcol,r:$('#er').value,u:$('#eu').value};if(!o.s)o.e='';if(!o.r)o.u='';const x=S.events.find(v=>v.id===id);x?Object.assign(x,o):S.events.push({id:uid(),...o})}
  save();dlg.close();go(view)},
 npick:e=>{np=e.dataset.id;nm='e';armP=null;notes()},
 tog:e=>{const p=S.pages.find(x=>x.id===e.dataset.id);p.open=p.open?0:1;save();notes()},
 nnew:()=>newP(null),nsub:e=>newP(e.dataset.id),
 ndel:()=>{if(armP!==np){armP=np;return notes()}const ids=new Set([np]);let n;do{n=ids.size;S.pages.forEach(p=>{if(ids.has(p.par))ids.add(p.id)})}while(ids.size>n);S.pages=S.pages.filter(p=>!ids.has(p.id));if(!S.pages.length)S.pages.push(mkPage(null));armP=null;np=null;nm='l';save();notes()},
 badd:()=>{const p=S.pages.find(x=>x.id===np),b={id:uid(),k:'p',x:''};p.b.push(b);focusId=b.id;save();rb(p.id)},
 bm:e=>{const p=pageOf(e),b=blkOf(e,p),i=p.b.indexOf(b),mv=d=>()=>{const j=i+d;if(j<0||j>=p.b.length)return;[p.b[i],p.b[j]]=[p.b[j],p.b[i]];save();rb(p.id)};
  showMenu(e.getBoundingClientRect(),[{l:'Move up',g:'↑',f:mv(-1)},{l:'Move down',g:'↓',f:mv(1)},{l:'Duplicate',g:'⧉',f:()=>{p.b.splice(i+1,0,{...b,id:uid()});save();rb(p.id)}},{l:'Delete block',g:'✕',f:()=>{p.b.splice(i,1);if(!p.b.length)p.b.push({id:uid(),k:'p',x:''});save();rb(p.id)}},...(TXT.includes(b.k)?TYPES.filter(t=>TXT.includes(t[0])&&t[0]!==b.k).map(t=>({l:'Turn into '+t[1],g:t[2],f:()=>conv(p,b,t[0])})):[])])},
 ledit:e=>{const p=pageOf(e),b=blkOf(e,p);b.u='';focusId=b.id;save();rb(p.id)},
 cemo:e=>{const b=blkOf(e,pageOf(e));b.e=EMO[(EMO.indexOf(b.e||'💡')+1)%EMO.length];e.textContent=b.e;save()}
});
if(!S.events){S.events=[];Object.entries(S.ev||{}).forEach(([d,a])=>a.forEach(e=>S.events.push({id:e.id,t:e.t,d,s:'',e:'',c:'ac'})))}
S.pm=S.pm||{};S.pomo=S.pomo||{};S.pt=S.pt||{};S.bk=S.bk||[];S.dw=S.dw||{};S.shv=S.shv||[];S.fin=S.fin||[];S.ch=S.ch||[];S.st=S.st||{};['terms','courses','exams','links','facs','jobs'].forEach(k=>{S.st[k]=S.st[k]||[]});S.st.goal=S.st.goal||0;if(!S.st.terms.length){const t={id:uid(),n:'Term 1'};S.st.terms.push(t);S.st.cur=t.id}if(!S.st.terms.find(t=>t.id===S.st.cur))S.st.cur=S.st.terms[0].id;stFix();S.fx=S.fx||{};S.cl=S.cl||[];if(!S.cb)S.cb={'฿':'THB','$':'USD','€':'EUR','£':'GBP','¥':'JPY'}[S.dcur]||'THB';Object.values(S.dw).forEach(e=>{if(!e.cu)e.cu=S.cb});S.fin.forEach(x=>{if(!x.cu)x.cu=S.cb});
if(!S.pages){S.pages=[];
 if(S.books)S.books.forEach(bk=>{const top={...mkPage(null,bk.t),ic:bk.kind==='diary'?'📓':'📘'};S.pages.push(top);bk.pages.forEach(p=>S.pages.push({id:p.id,t:p.t||(p.d?thd(p.d):''),ic:'📄',par:top.id,open:1,b:p.b}))});
 else(S.notes||[]).forEach(n=>S.pages.push({id:n.id,t:n.t,ic:'📄',par:null,open:1,b:n.b}));
 if(!S.pages.length)S.pages.push(mkPage(null));
 delete S.books;delete S.diary;delete S.notes;delete S.ev}
if(!S.v2){S.pages.forEach(p=>p.b.forEach(b=>{b.x=esc(b.x)}));S.v2=1}
const CN={'ต้องทำ':'To do','กำลังทำ':'Doing','เสร็จแล้ว':'Done'};S.cols.forEach(c=>{if(CN[c.n])c.n=CN[c.n]});
S.cards=S.cards.filter(c=>!(['a1','a2','a3'].includes(c.id)&&['อ่านบทที่ 3 ชีววิทยา','ติวสอบกลางภาค','ซื้อของเข้าห้อง'].includes(c.t)));
S.pages=S.pages.filter(p=>!(p.id==='n1'&&p.t==='สรุปบทเรียน'));if(!S.pages.length)S.pages.push(mkPage(null));
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.cc){pcol=t.value;t.closest('.pal').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===t.parentNode));t.parentNode.style.background=t.value}});
delete S.theme;save();go('board');startSync();
</script>
